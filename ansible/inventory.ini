[CHOICE_A]
# Docker maps SSH on the nginx/Spring web container to localhost:2222.
web ansible_host=127.0.0.1 ansible_port=2222 ansible_user=root ansible_password=Hello@123 ansible_remote_tmp=/tmp/ansible ansible_ssh_common_args='-o StrictHostKeyChecking=no'

[CHOICE_A_LOAD_BALANCER]
# Docker maps SSH on the identical load balancer web container to localhost:2223.
web-lb ansible_host=127.0.0.1 ansible_port=2223 ansible_user=root ansible_password=Hello@123 ansible_remote_tmp=/tmp/ansible ansible_ssh_common_args='-o StrictHostKeyChecking=no'
